<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANTONY BLACK | Premium Streetwear</title>
    <!-- Tailwind CSS para el diseño responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts para tipografía urbana -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para los iconos de la tienda -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SDK Oficial de EmailJS obligatorio para los correos -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #050507; color: #ffffff; }
        .card { background: linear-gradient(145deg, #0f0f12, #070709); border: 1px solid rgba(255,255,255,0.03); transition: all 0.3s ease; }
        .card:hover { border-color: #e11d48; box-shadow: 0 10px 30px -10px rgba(225,29,72,0.2); }
        #cart, #c-box { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        #cart { transform: translateX(100%); }
        #cart.open { transform: translateX(0); }
        #c-box { transform: translateY(120%); }
        #c-box.open { transform: translateY(0); }
        .modal { opacity: 0; pointer-events: none; transition: all 0.3s ease; }
        .modal.active { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body class="overflow-x-hidden">

    <!-- 🕷️ HEADER / BARRA DE NAVEGACIÓN -->
    <header class="sticky top-0 z-40 bg-[#050507]/80 backdrop-blur-md border-b border-white/5 px-4 py-4 sm:px-8 flex justify-between items-center">
        <a href="#" class="text-lg font-bold tracking-widest text-white uppercase">ANTONY <span class="text-[#e11d48]">BLACK</span></a>
        <button onclick="togA(1)" class="relative p-2 text-gray-400 hover:text-white transition-all">
            <i class="fa-solid fa-bag-shopping text-xl"></i>
            <span id="c-count" class="absolute -top-1 -right-1 bg-[#e11d48] text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
        </button>
    </header>

    <!-- 🕷️ SECCIÓN DE BIENVENIDA (HERO) -->
    <section class="relative bg-black py-20 px-4 text-center border-b border-white/5 overflow-hidden">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(225,29,72,0.1)_0%,transparent_70%)]"></div>
        <div class="relative z-10 max-w-2xl mx-auto space-y-4">
            <span class="text-[#e11d48] text-xs uppercase tracking-widest font-bold">Colección Didáctica Exclusiva</span>
            <h1 class="text-3xl sm:text-5xl font-bold tracking-tighter uppercase">Diseño Disruptivo e Imponente</h1>
            <p class="text-gray-400 text-sm max-w-md mx-auto">Heavy cotton y cortes de alta costura urbana pensados para dominar las calles.</p>
            <div class="pt-4 flex justify-center gap-3">
                <button onclick="flt('todos')" id="b-all" class="px-5 py-2 rounded-full text-xs uppercase tracking-wider font-medium bg-[#e11d48] text-white">Todos</button>
                <button onclick="flt('hombres')" id="b-men" class="px-5 py-2 rounded-full text-xs uppercase tracking-wider font-medium bg-[#121214] text-gray-400 border border-white/5">Hombres</button>
                <button onclick="flt('mujeres')" id="b-women" class="px-5 py-2 rounded-full text-xs uppercase tracking-wider font-medium bg-[#121214] text-gray-400 border border-white/5">Mujeres</button>
            </div>
        </div>
    </section>

    <!-- 🕷️ CONTENEDOR PRINCIPAL DEL CATÁLOGO -->
    <main id="catalogo" class="max-w-7xl mx-auto px-4 py-12">
        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4">
            <!-- Los productos se inyectan dinámicamente desde el script.js -->
        </div>
    </main>

    <!-- 🕷️ PANEL LATERAL DE LA BOLSA DE COMPRAS (CARRITO) -->
    <div id="cart" class="fixed top-0 right-0 h-full w-full sm:w-[400px] z-50 bg-[#0b0b0d] border-l border-white/5 shadow-2xl flex flex-col">
        <div class="p-4 border-b border-white/5 flex justify-between items-center bg-black/40">
            <h2 class="font-bold uppercase tracking-wider text-sm flex items-center gap-2"><i class="fa-solid fa-basket-shopping text-[#e11d48]"></i> Tu Bolsa de Compra</h2>
            <button onclick="togA(0)" class="text-gray-500 hover:text-white p-2 text-sm"><i class="fa-solid fa-xmark"></i> Cerrar</button>
        </div>
        <div id="c-items" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        <div class="p-4 border-t border-white/5 bg-black/40 space-y-4">
            <div class="flex justify-between items-center text-sm">
                <span class="text-gray-400">Total acumulado:</span>
                <span id="c-total" class="text-lg font-bold text-[#e11d48]">$0.00</span>
            </div>
            <button onclick="openCheckout()" class="w-full bg-white text-black hover:bg-[#e11d48] hover:text-white font-bold text-xs uppercase tracking-widest py-4 rounded-xl transition-all shadow-lg">
                Proceder al Pago Seguro
            </button>
        </div>
    </div>

    <!-- 🕷️ VENTANA MODAL FLOTANTE (PASARELA DE COBRO CON TUS DATOS) -->
    <div id="m-pay" class="modal fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-[#0b0b0d] border border-white/5 w-full max-w-xl rounded-3xl p-5 sm:p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto relative">
            <div class="flex justify-between items-center border-b border-white/5 pb-3">
                <h3 class="font-bold text-sm uppercase tracking-wider flex items-center gap-2 text-white"><i class="fa-solid fa-shield-halved text-[#e11d48]"></i> Pasarela de Pago</h3>
                <button onclick="togM('pay', 0)" class="text-gray-500 hover:text-white p-1 text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-2 text-xs bg-white/5 p-3 rounded-2xl border border-white/5">
                <div id="pay-items-summary" class="space-y-1.5 text-gray-400"></div>
                <div class="flex justify-between items-center border-t border-white/5 pt-2 font-bold">
                    <span class="text-gray-300">Cantidad Total a Pagar:</span>
                    <span id="pay-total-display" class="text-[#e11d48] text-sm">$0.00</span>
                </div>
            </div>
            <form id="checkout-form" onsubmit="procesarOrden(event)" class="space-y-4"></form>
        </div>
    </div>

    <!-- 🕷️ BOTÓN FLOTANTE DEL CHATBOT INTERACTIVO -->
    <button id="t-cht" class="fixed bottom-5 right-5 z-40 bg-[#e11d48] text-white w-12 h-12 rounded-full flex items-center justify-center shadow-2xl hover:scale-110 active:scale-95 transition-all">
        <i class="fa-solid fa-comment-dots text-lg"></i>
    </button>

    <!-- 🕷️ CAJA DEL CHATBOT DE SOPORTE PREMIUM -->
    <div id="c-box" class="fixed bottom-20 right-5 z-40 bg-[#0b0b0d] border border-white/5 w-[90vw] sm:w-[360px] h-[450px] rounded-3xl shadow-2xl flex flex-col overflow-hidden">
        <div class="bg-[#121215] border-b border-white/5 p-3.5 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></div>
                <span class="text-xs font-bold tracking-wider uppercase text-gray-200">Soporte Antony Black</span>
            </div>
            <button onclick="togCh()" class="text-gray-500 hover:text-white text-xs px-2"><i class="fa-solid fa-chevron-down"></i></button>
        </div>
        <div id="c-msg" class="flex-1 overflow-y-auto p-3.5 space-y-2 text-xs"></div>
        <form onsubmit="return bot(event)" class="p-2 border-t border-white/5 bg-black/40 flex gap-2">
            <input id="c-in" type="text" placeholder="Escribe tu duda aquí..." class="flex-1 bg-[#121215] text-white text-xs px-4 py-3 rounded-xl outline-none border border-white/5 focus:border-[#e11d48] transition-all placeholder-gray-600">
            <button type="submit" class="bg-white text-black hover:bg-[#e11d48] hover:text-white w-10 h-10 rounded-xl flex items-center justify-center transition-all shadow-md"><i class="fa-solid fa-paper-plane text-xs"></i></button>
        </form>
    </div>

    <!-- 🕷️ CONEXIÓN DE RUTA RELATIVA INELUDIBLE -->
    <script src="./script.js"></script>
</body>
</html>
